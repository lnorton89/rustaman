[package]
name = "rustaman"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
description = "A modern Windows task manager: process, service, startup and performance management in one native app."
license = "MIT"
repository = "https://github.com/lnorton89/rustaman"
readme = "README.md"
keywords = ["windows", "task-manager", "process", "performance", "gui"]
categories = ["gui", "os::windows-apis"]

[lib]
name = "rustaman"
path = "src/lib.rs"

[[bin]]
name = "rustaman"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "7"
clap = { version = "4", features = ["derive"] }
# Used by one-shot background UI jobs (services/startup refreshes).
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
# The GUI stack, current release — and Windows-only, like the front end
# it builds. `gui` is `cfg(windows)` because it draws data only
# `win` can produce, so there is nothing for egui to render on another
# platform. Scoping it here is what lets the portable core (`model`,
# `theme`, `format`, `color`, `config`) compile and run its tests on a
# Linux CI runner without dragging in winit, wgpu and an X11 stack that
# have no one to talk to there.
#
# Held on wgpu rather than the default glow/glutin path: wgpu picks D3D12
# or Vulkan according to what the machine exposes, where glutin's WGL path
# is the one that fails on machines with a stale or hybrid OpenGL ICD —
# common on exactly the switchable-graphics laptops this app is most
# useful on.
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
egui = "0.36"
egui_extras = "0.36"

# Every system fact in this app comes through here. `windows-sys` rather
# than `windows`: this crate's Win32 surface is raw structs and function
# pointers wrapped by hand in `src/win/` (see the safe-leaf-wrapper rule
# in CLAUDE.md), so the higher-level crate's generated wrappers and COM
# machinery would be a second abstraction over the one that is actually
# used, at several times the compile time.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # Process enumeration, control, and token inspection.
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    # SetThreadErrorMode: stops a not-ready device putting a modal
    # "insert a disk" dialog in front of the sampler thread and blocking
    # it there. See win::system::suppress_device_error_dialogs.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Kernel",
    # NtQuerySystemInformation: one call gets CPU, memory, and I/O for
    # every process at once. It lives under the `Wdk` namespace rather
    # than `Win32` because the public SDK does not document it — which is
    # also why `src/win/nt/types.rs` declares the struct layouts by hand
    # instead of importing the redacted ones from Win32_System_
    # WindowsProgramming.
    "Wdk_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    # PDH, for the GPU engine counters. There is no Win32 call for GPU
    # utilisation — Task Manager reads the same counters.
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Environment",
    # Physical-disk performance counters (IOCTL_DISK_PERFORMANCE).
    "Win32_System_Ioctl",
    "Win32_System_IO",
    # Access tokens, SIDs, and the elevation/integrity queries the
    # process list reports.
    "Win32_Security",
    "Win32_Security_Authorization",
    # CreateFileW, GetLogicalDrives, and the version-info calls the
    # friendly-name column reads out of each executable.
    "Win32_Storage_FileSystem",
    # Adapter throughput and the per-PID TCP/UDP connection tables.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # Shell icons, "open file location", and the properties dialog.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    # Dark title bar on the native-chrome setting. Win10 1809+ only, so
    # the call is probed at runtime rather than assumed.
    "Win32_Graphics_Dwm",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the application icon and the side-by-side manifest into the
# .exe. Without the icon, Explorer and the taskbar show the generic
# blank-page icon — eframe's runtime window icon only covers the window
# itself. Without the manifest, Windows lies to the app about the DPI and
# gives it the Windows 8 behaviour for every version check.
winresource = "0.1"

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "0.36.1", features = ["wgpu", "snapshot"] }

[dev-dependencies]
# The brand-asset generator (`cargo run --example brand_assets`) writes
# the PNGs and the .ico that `build.rs` embeds.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
# What ships. Fat LTO over one codegen unit is the smallest, fastest
# binary, and it is also why this profile has no incremental rebuild: an
# edit to any file in this crate re-runs whole-program optimisation over
# every dependency — wgpu, naga, egui, winit — on a single LLVM thread.
# On Windows that is about two minutes after a one-line change, nearly
# all of it in the LTO step. That cost belongs to a release; for running
# the app while working on it, use `release-fast` below.
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
# A task manager that panics should say so and stop, not unwind through
# a sampler thread holding an open handle to every process on the box.
panic = "abort"

# The optimised build for day-to-day work: `cargo run --profile
# release-fast`. Same `opt-level`, `panic = "abort"`, stripping and
# GUI subsystem as `release`, so it runs and behaves like the app
# rather than like a debug build — but without LTO, and incremental.
#
# Measured on the Windows target, after a one-line edit to a file in
# `src/gui/`, up to the link: `release` 148 s, this profile 3 s. A clean
# build of the dependencies costs about the same as `release` does.
#
# It is not the binary that ships, and it is not the one to measure the
# app's own performance with — see docs/PERFORMANCE.md §6.
[profile.release-fast]
inherits = "release"
lto = false
incremental = true
# Dependencies at rustc's own release default. They build once, so
# there is no reason to trade their optimisation for build parallelism.
codegen-units = 16

# This crate at 256 units, which is rustc's default for an incremental
# build and what makes the rebuild small: an edit invalidates the few
# units that hold the changed functions. At 16 the same edit rebuilt in
# 7.6 s rather than 3.
[profile.release-fast.package.rustaman]
codegen-units = 256

# Dependencies keep file and line numbers (so backtraces still name the
# line inside egui or wgpu) but not full type and variable information.
# This crate keeps full debuginfo. On Windows, most of a small debug
# rebuild is link.exe writing the PDB, and that work scales with the
# debuginfo it is given. This cuts what the linker reads for the
# Windows target from 1.27 GB of rlibs to 0.77 GB, with no change to
# compile time. The cost is that a debugger stopped inside a dependency
# shows the line but not the locals.
[profile.dev.package."*"]
debug = "line-tables-only"

[lints.rust]
warnings = "deny"
dead_code = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
unused_variables = "deny"
unused_imports = "forbid"
unused_must_use = "forbid"
unreachable_patterns = "forbid"
unreachable_pub = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
ignored_unit_patterns = "deny"
allow_attributes = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
